name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The oracle feature is exercised by the dedicated job below, which pins the Python dependencies.
      - run: cargo test --workspace
      - name: Cross-platform phase benchmark and peak RSS smoke test
        run: python tests/p7c_audit.py --iterations 3

  oracle:
    name: python oracle differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tests/oracle/requirements.txt
      - name: Regenerate fixtures (self-consistency check)
        run: python tests/fixtures/generate.py
      - name: Oracle baseline
        run: python tests/oracle/runner.py
      - name: Rust differential
        run: cargo test -p docxtpl-rs --features oracle
      - name: Jinja live differential
        env:
          DOCXTPL_PYTHON_ORACLE: python
        run: cargo test -p docxtpl-template live_python_oracle_for_new_compat_surface
      - name: LibreOffice open and resave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer
          cargo build -p docxtpl-cli
          python tests/office_check.py

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --workspace
