name: release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Keep build state inside the project
        shell: bash
        run: |
          toolchain_bin="$(dirname "$(rustup which rustc)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          {
            echo "CARGO_HOME=$GITHUB_WORKSPACE/.cache/cargo"
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target"
            echo "RUSTC=$toolchain_bin/rustc"
            echo "RUSTDOC=$toolchain_bin/rustdoc"
            echo "TMPDIR=$GITHUB_WORKSPACE/.tmp"
            echo "PIP_CACHE_DIR=$GITHUB_WORKSPACE/.cache/pip"
          } >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.cache/cargo" "$GITHUB_WORKSPACE/.cache/pip" "$GITHUB_WORKSPACE/.tmp"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Create pinned Python oracle environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r tests/oracle/requirements.txt
      - run: .venv/bin/python tests/oracle/runner.py
      - run: cargo test -p docxtpl-rs --features oracle --locked
        env:
          DOCXTPL_PYTHON: ${{ github.workspace }}/.venv/bin/python
          DOCXTPL_PYTHON_ORACLE: ${{ github.workspace }}/.venv/bin/python
      - name: Live Jinja differential
        env:
          DOCXTPL_PYTHON: ${{ github.workspace }}/.venv/bin/python
          DOCXTPL_PYTHON_ORACLE: ${{ github.workspace }}/.venv/bin/python
        run: cargo test -p docxtpl-template live_python_oracle_for_new_compat_surface --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python tests/license_audit.py
      - name: RustSec dependency audit
        run: |
          git clone --depth 1 https://github.com/RustSec/advisory-db.git .cache/rustsec-db
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --db .cache/rustsec-db --no-fetch
      - name: Package all crates
        run: cargo package --workspace --locked --no-verify
      - name: Build and run only from packaged crates
        run: python tests/release_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: docxtpl-rs-${{ github.sha }}-crates
          if-no-files-found: error
          path: |
            target/package/*.crate
            target/license-audit.json

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Keep build state inside the project
        shell: bash
        run: |
          toolchain_bin="$(dirname "$(rustup which rustc)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          {
            echo "CARGO_HOME=$GITHUB_WORKSPACE/.cache/cargo"
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target"
            echo "RUSTC=$toolchain_bin/rustc"
            echo "RUSTDOC=$toolchain_bin/rustdoc"
            echo "TMPDIR=$GITHUB_WORKSPACE/.tmp"
          } >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.cache/cargo" "$GITHUB_WORKSPACE/.tmp"
      - run: cargo check --workspace --locked
