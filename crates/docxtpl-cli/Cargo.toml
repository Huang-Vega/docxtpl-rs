[package]
name = "docxtpl-cli"
description = "docxtpl-rs 命令行：render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "docxtpl"
path = "src/main.rs"

[dependencies]
docxtpl-rs = { path = "../docxtpl-rs" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
