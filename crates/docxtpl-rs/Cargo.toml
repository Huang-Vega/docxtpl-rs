[package]
name = "docxtpl-rs"
description = "Independent Rust DOCX template renderer compatible with Python docxtpl 0.20.2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Enable Python oracle differential integration tests (requires a local Python interpreter plus the tests/oracle dependencies).
oracle = []

[dependencies]
crc32fast = "1.5"
docxtpl-compat = { version = "=1.0.0", path = "../docxtpl-compat" }
docxtpl-opc = { version = "=1.0.0", path = "../docxtpl-opc" }
docxtpl-rich = { version = "=1.0.0", path = "../docxtpl-rich" }
docxtpl-template = { version = "=1.0.0", path = "../docxtpl-template" }
docxtpl-xml = { version = "=1.0.0", path = "../docxtpl-xml" }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
zip.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
