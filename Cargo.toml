[workspace]
resolver = "2"
members = [
    "crates/docxtpl-rs",
    "crates/docxtpl-opc",
    "crates/docxtpl-xml",
    "crates/docxtpl-template",
    "crates/docxtpl-compat",
    "crates/docxtpl-rich",
    "crates/docxtpl-cli",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
rust-version = "1.85"
license = "LGPL-2.1-only"
repository = "https://github.com/Huang-Vega/docxtpl-rs"
homepage = "https://github.com/Huang-Vega/docxtpl-rs"
readme = "README.md"
keywords = ["docx", "jinja", "template", "ooxml"]
categories = ["template-engine", "text-processing"]

[workspace.dependencies]
# OOXML only needs ZIP codecs and its own DOS timestamp representation. Keeping
# zip's optional `time` feature disabled avoids pulling a higher-MSRV parser and
# the RUSTSEC-2026-0009 stack-exhaustion path.
zip = { version = "2", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate", "lzma", "zstd", "xz"] }
